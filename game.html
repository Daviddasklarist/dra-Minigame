<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRA Minigame</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #efefef;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      position: relative;
      width: 900px;
      height: 400px;
      border: 6px solid #333;
      border-radius: 12px;
      /* Heller / fast transparenter Hintergrund:
         Overlay (weiß, 0.85) macht das Bild deutlich heller */
      background:
        linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.6)),
        url('background1.jpg') center/cover no-repeat;
      background-color: #ffffff; /* Fallback-Farbe */
      overflow: hidden;
      touch-action: none; /* verhindert Scroll/Pan beim Tippen */
    }

    /* Canvas spezifisch: keine Auswahl/Panning, deutlicher Pointer auf Klickgeräten */
    #gameCanvas {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      cursor: pointer;
    }

    #score, #coins {
      position: absolute;
      top: 10px;
      background: rgba(0, 0, 0, 0.05);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      color: #111;
    }

    #score { left: 10px; }
    #coins { right: 10px; background: rgba(255, 215, 0, 0.2); }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px 40px;
      border-radius: 10px;
      font-size: 22px;
      display: none;
      text-align: center;
    }
    /* Start-Overlay */
    #startMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      color: #fff;
      padding: 22px 36px;
      border-radius: 12px;
      font-size: 18px;
      line-height: 1.3;
      display: block; /* sichtbar vor Start */
      text-align: center;
      white-space: pre-line;
      max-width: 86%;
      z-index: 60;
    }
    /* Popup für Park-Strafe */
    #finePopup {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      display: none;
      max-width: 80%;
      text-align: center;
      z-index: 50;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="score">Score: 0</div>
    <div id="coins">💰 0 €</div>
    <div id="message">Game Over<br><small>Drücke <b>Leertaste</b> für Neustart</small></div>
    <div id="finePopup">Hier ist Halteverbot, Kollege! Fürs Falschparken gibts 20 Euro Strafe!</div>
    <div id="startMessage">
      Wir bauen Augsburg wieder auf!<br>
      Nur du kannst’s richten! Hüpf über alles, was saniert werden muss und füll die Stadtkasse wieder auf!<br>
      <strong>Drück die Leertaste zum Starten.</strong>
    </div>
    <canvas id="gameCanvas" width="900" height="400"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const jumpSound = new Audio("Boing.mp3");
    const cashSound = new Audio("cash.mp3");
    cashSound.volume = 0.9;

    const playerImg = new Image();
    playerImg.src = "spieler.png";
    let playerMask = null;

    const player = {
      x: 120,
      width: 100,
      height: 100,
      y: 0,
      velocityY: 0,
      jumpPower: 20,
      gravity: 0.7,
      onGround: true,
      mask: null
    };

    playerImg.onload = () => {
      const w = playerImg.naturalWidth;
      const h = playerImg.naturalHeight;
      const buf = document.createElement("canvas");
      buf.width = w;
      buf.height = h;
      const bx = buf.getContext("2d");
      bx.drawImage(playerImg, 0, 0, w, h);
      const data = bx.getImageData(0, 0, w, h).data;
      const mask = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
        mask[p] = (a > 16 && !(r > 240 && g > 240 && b > 240)) ? 1 : 0;
      }
      playerMask = { data: mask, w, h };
      player.mask = playerMask;
    };

    const obstacleImgs = [
      { src: "hindernis1.png" },
      { src: "hindernis2.png" },
      { src: "hindernis3.png" },
      { src: "hindernis4.png" },
      { src: "hindernis5.png" },
      { src: "special1.png" }
    ].map(o => {
      const img = new Image();
      img.src = o.src;
      o.img = img;
      o.mask = null;
      o.isSpecial = (o.src === "special1.png");
      img.onload = () => {
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        const buf = document.createElement("canvas");
        buf.width = w;
        buf.height = h;
        const bx = buf.getContext("2d");
        bx.drawImage(img, 0, 0, w, h);
        const data = bx.getImageData(0, 0, w, h).data;
        const mask = new Uint8Array(w * h);
        for (let i = 0, p = 0; i < data.length; i += 4, p++) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          mask[p] = (a > 16 && r < 50 && g < 50 && b < 50) ? 1 : 0;
        }
        let lastSolidRow = -1;
        for (let row = h - 1; row >= 0; row--) {
          for (let col = 0; col < w; col++) {
            if (mask[row * w + col]) { lastSolidRow = row; break; }
          }
          if (lastSolidRow !== -1) break;
        }
        const bottomTrim = (lastSolidRow === -1) ? 0 : (h - 1 - lastSolidRow);
        o.mask = { data: mask, w, h };
        o.bottomTrim = bottomTrim;
      };
      return o;
    });

    const coinImg = new Image();
    coinImg.src = "muenze.png";

    const groundY = 300;
    // Player auf Boden platzieren, damit er nicht oben "schwebt"
    player.y = groundY;
    player.onGround = true;

    // Spielstatistiken
    let coinsCollected = 0;
    let obstaclesDodged = 0;
    let specialsHit = 0;
    let startTimestamp = null;
    let endTimestamp = null;

    let obstacles = [];
    let coins = [];
    let obstacleSpeed = 7;
    let score = 0;
    let euros = 0;
    let gameOver = false;
    let started = false;
    let lastObstacleTime = performance.now();
    let lastCoinTime = performance.now();

    // messages
    let gameMessages = [{ "text": "Game Over", "weight": 1 }];
    let currentGameOverMessage = null;

    fetch("game_messages.json")
      .then(r => r.ok ? r.json() : Promise.reject("msg file missing"))
      .then(json => { gameMessages = json; })
      .catch(() => { /* fallback */ });

    function pickMessage({ euros = 0, score = 0 }) {
      const candidates = gameMessages.filter(m => {
        if (typeof m.minEuros === "number" && euros < m.minEuros) return false;
        if (typeof m.minScore === "number" && score < m.minScore) return false;
        return true;
      });
      if (candidates.length === 0) candidates.push(...gameMessages);
      const total = candidates.reduce((s, c) => s + (c.weight || 1), 0);
      let r = Math.random() * total;
      for (const c of candidates) {
        r -= (c.weight || 1);
        if (r <= 0) return c.text;
      }
      return candidates[0].text;
    }

    function formatMessage(template, vars) {
      return template.replace(/\{(score|euros|fehlende)\}/g, (_, k) => vars[k] ?? "");
    }

    // unify input: first action starts via click/tap (no jump), Space only jumps/reset after start
    function performPrimaryAction() {
      if (gameOver) {
        resetGame();
        return;
      }
      if (!started) {
        started = true;
        startTimestamp = performance.now();
        document.getElementById("startMessage").style.display = "none";
        return;
      }
      if (player.onGround) {
        player.velocityY = -player.jumpPower;
        player.onGround = false;
        jumpSound.currentTime = 0;
        jumpSound.play().catch(() => {});
      }
    }

    // kleines Input‑Lock, damit pointerdown + click nicht doppelt auslösen
    let inputLocked = false;
    function lockInput(ms = 200) {
      inputLocked = true;
      setTimeout(() => { inputLocked = false; }, ms);
    }

    // keyboard: Space/Leertaste löst dieselbe Aktion wie Klick/Tap aus
    document.addEventListener("keydown", e => {
      if (e.code === "Space" || e.key === " ") {
        e.preventDefault();
        if (inputLocked) return;
        performPrimaryAction();
        lockInput(200);
      }
    });

    // pointer (mouse/touch) — auf den Container lauschen, nur pointerdown (kein zusätzlicher click)
    const containerEl = document.getElementById("gameContainer");
    containerEl.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (inputLocked) return;
      performPrimaryAction();
      lockInput(200);
    }, { passive: false });

    function spawnObstacle() {
      // select a non-special normally; select special only if euros >= 20
      let o = null;
      for (let tries = 0; tries < 12; tries++) {
        const cand = obstacleImgs[Math.floor(Math.random() * obstacleImgs.length)];
        if (cand.isSpecial) {
          if (euros >= 20) { o = cand; break; }
          // skip special if not enough euros
          continue;
        } else {
          o = cand;
          break;
        }
      }
      if (!o) o = obstacleImgs.find(x => !x.isSpecial) || obstacleImgs[0];

      const natW = o.img.naturalWidth || 0;
      const natH = o.img.naturalHeight || 0;
      let width, height, y;
      if (natW && natH) {
        const baseDisplayH = 160 + Math.random() * 40; // 160..200
        const extraScale = 1 + Math.random() * 0.25;
        const displayHeight = Math.round(baseDisplayH * extraScale);
        const scale = displayHeight / natH;
        height = displayHeight;
        width = Math.round(natW * scale);
        const nativeBottomTrim = (typeof o.bottomTrim === "number") ? o.bottomTrim : 20;
        const bottomTrimScaled = Math.round(nativeBottomTrim * scale);
        y = groundY + player.height - (height - bottomTrimScaled);
      } else {
        const size = 160 + Math.random() * 40;
        width = Math.round(size * (1 + Math.random() * 0.25));
        height = Math.round(size * (1 + Math.random() * 0.25));
        y = groundY + player.height - height + 20;
      }
      obstacles.push({
        x: canvas.width,
        width,
        height,
        y,
        img: o.img,
        mask: o.mask,
        isSpecial: !!o.isSpecial,
        hit: false,
        passed: false // für Dodged-Statistik
      });
    }

    function spawnCoin() {
      coins.push({
        x: canvas.width + 100,
        y: groundY - 40 - Math.random() * 60,
        width: 50,
        height: 50,
        collected: false
      });
    }

    function checkCollision(p, o, pad = 15, expand = 0) {
      return (
        p.x + pad < o.x + o.width - pad + expand &&
        p.x + p.width - pad > o.x + pad - expand &&
        p.y + p.height - pad > o.y + pad - expand &&
        p.y < o.y + o.height - pad + expand
      );
    }

    function pixelCollision(p, o) {
      if (!p.mask || !o.mask) return checkCollision(p, o, 0, 0);

      const pNatW = p.mask.w, pNatH = p.mask.h;
      const oNatW = o.mask.w, oNatH = o.mask.h;
      const ow = o.width, oh = o.height;

      const left = Math.max(p.x, o.x) | 0;
      const right = Math.min(p.x + p.width, o.x + ow) | 0;
      const top = Math.max(p.y, o.y) | 0;
      const bottom = Math.min(p.y + p.height, o.y + oh) | 0;
      if (right <= left || bottom <= top) return false;

      const pScaleX = pNatW / p.width;
      const pScaleY = pNatH / p.height;
      const oScaleX = oNatW / ow;
      const oScaleY = oNatH / oh;
      const pMask = p.mask.data;
      const oMask = o.mask.data;

      for (let y = top; y < bottom; y++) {
        const pMy = Math.floor((y - p.y) * pScaleY);
        const oMy = Math.floor((y - o.y) * oScaleY);
        if (pMy < 0 || pMy >= pNatH || oMy < 0 || oMy >= oNatH) continue;
        const pRow = pMy * pNatW;
        const oRow = oMy * oNatW;
        for (let x = left; x < right; x++) {
          const pMx = Math.floor((x - p.x) * pScaleX);
          const oMx = Math.floor((x - o.x) * oScaleX);
          if (pMx < 0 || pMx >= pNatW || oMx < 0 || oMx >= oNatW) continue;
          const pIdx = pRow + pMx;
          const oIdx = oRow + oMx;
          if (pMask[pIdx] && oMask[oIdx]) return true;
        }
      }
      return false;
    }

    let finePopupTimer = null;
    function showFinePopup() {
      const el = document.getElementById("finePopup");
      if (!el) return;
      if (finePopupTimer) clearTimeout(finePopupTimer);
      el.style.display = "block";
      finePopupTimer = setTimeout(() => { el.style.display = "none"; finePopupTimer = null; }, 2500);
    }

    function update(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ccc";
      ctx.fillRect(0, groundY + player.height, canvas.width, 10);

      // draw player
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

      // draw obstacles & coins (positions updated below only when started and not gameOver)
      obstacles.forEach(o => ctx.drawImage(o.img, o.x, o.y, o.width, o.height));
      coins.forEach(c => { if (!c.collected) ctx.drawImage(coinImg, c.x, c.y, c.width, c.height); });

      // Start overlay
      if (!started && !gameOver) {
        document.getElementById("startMessage").style.display = "block";
        document.getElementById("message").style.display = "none";
        requestAnimationFrame(update);
        return;
      } else {
        document.getElementById("startMessage").style.display = "none";
      }

      // Game over freeze
      if (gameOver) {
        obstacleSpeed = 7;
        const raw = currentGameOverMessage || pickMessage({ euros, score });
        const remaining = Math.max(0, 420000000 - euros);
        const playTimeMs = startTimestamp ? ((endTimestamp || performance.now()) - startTimestamp) : 0;
        const playTimeSec = Math.floor(playTimeMs / 1000);
        const statsHtml =
          `<div style="text-align:left;margin-top:10px">` +
          `<strong>Deine Statistik:</strong><br>` +
          `Punkte: ${score}<br>` +
          `Stadtkasse: ${euros} €<br>` +
          `Hindernisse umgangen: ${obstaclesDodged}<br>` +
          `Ordnungsamt-Fälle: ${specialsHit}<br>` +
          `Spielzeit: ${playTimeSec} s<br>` +
          `Verbleibend: ${remaining} €` +
          `</div>`;
        const html = `${formatMessage(raw, { euros, score, fehlende: remaining })}${statsHtml}<br><small>Drücke <b>Leertaste</b> für Neustart</small>`;
        document.getElementById("message").innerHTML = html;
        document.getElementById("message").style.display = "block";
        requestAnimationFrame(update);
        return;
      } else {
        document.getElementById("message").style.display = "none";
      }

      // physics
      if (!player.onGround) {
        player.velocityY += player.gravity;
        player.y += player.velocityY;
        if (player.y >= groundY) {
          player.y = groundY;
          player.velocityY = 0;
          player.onGround = true;
        }
      }

      // move objects
      obstacles.forEach(o => { o.x -= obstacleSpeed; });
      obstacles = obstacles.filter(o => o.x + o.width > 0);

      // Count dodged obstacles when they pass the player x
      for (const o of obstacles) {
        if (!o.passed && (o.x + o.width) < player.x) {
          o.passed = true;
          // only count as dodged if it wasn't a special hit (specials that were hit get removed)
          if (!o.isSpecial) obstaclesDodged++;
        }
      }

      coins.forEach(c => { c.x -= obstacleSpeed; });
      coins = coins.filter(c => c.x + c.width > 0);

      // collect coins
      coins.forEach(c => {
        if (!c.collected && checkCollision(player, c, 10, 15)) {
          c.collected = true;
          euros += 1; // aktuell 1€
          coinsCollected++;
          document.getElementById("coins").textContent = `💰 ${euros} €`;
          cashSound.currentTime = 0;
          cashSound.play().catch(() => {});
        }
      });

      // collisions
      for (const o of obstacles) {
        if (pixelCollision(player, o)) {
          if (o.isSpecial) {
            if (!o.hit) {
              euros = Math.max(0, euros - 20);
              document.getElementById("coins").textContent = `💰 ${euros} €`;
              showFinePopup();
              o.hit = true;
              specialsHit++;
            }
            o.x = -o.width;
            continue;
          } else {
            gameOver = true;
            endTimestamp = performance.now();
            if (!currentGameOverMessage) currentGameOverMessage = pickMessage({ euros, score });
            break;
          }
        }
      }

      if (started && !gameOver) {
        score++;
        document.getElementById("score").textContent = `Score: ${score}`;
      }

      if (score % 300 === 0 && score > 0) {
        obstacleSpeed = Math.min(obstacleSpeed + 0.3, 16);
      }

      if (started && obstacles.length === 0 && timestamp - lastObstacleTime > 1300 + Math.random() * 1000) {
        spawnObstacle();
        lastObstacleTime = timestamp;
      }

      if (started && timestamp - lastCoinTime > 2500 + Math.random() * 3000) {
        spawnCoin();
        lastCoinTime = timestamp;
      }

      requestAnimationFrame(update);
    }

    function resetGame() {
      obstacles = [];
      coins = [];
      obstacleSpeed = 7;
      score = 0;
      euros = 0;
      coinsCollected = 0;
      obstaclesDodged = 0;
      specialsHit = 0;
      gameOver = false;
      started = false;
      currentGameOverMessage = null;
      player.y = groundY;
      player.velocityY = 0;
      lastObstacleTime = performance.now();
      lastCoinTime = performance.now();
      startTimestamp = null;
      endTimestamp = null;
      document.getElementById("score").textContent = "Score: 0";
      document.getElementById("coins").textContent = "💰 0 €";
      document.getElementById("message").style.display = "none";
      document.getElementById("startMessage").style.display = "block";
    }

    // start loop
    requestAnimationFrame(update);
  </script>
</body>
</html>
